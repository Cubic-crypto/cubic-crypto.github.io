<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Website</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.wrapper{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

iframe{
    width:125vw;
    height:125vh;
    border:none;

    transform:scale(0.8);
    transform-origin:top left;
}
</style>
</head>

<body>

<div class="wrapper">
    <iframe src="https://castles.cc"></iframe>
</div>

</body>
</html>

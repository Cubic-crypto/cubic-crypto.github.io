<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Crafting Recipes — Cubic Crypto</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><img src="Cubic_Crypto_2.png" alt="Cubic Crypto PNG"></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="prices.html">Prices</a>
      <a href="craft.html" class="active">Crafting</a>
      <a href="contact-support.html">Support</a>
    </nav>
  </header>

  <main class="container">
    <section class="card page-header">
      <h1>Crafting Recipe Database</h1>
      <p class="header-subtitle">Browse over 1000+ crafting recipes for Cubic Castles items</p>
      
      <div class="search-wrapper">
        <input type="text" id="craft-search" class="search-bar" placeholder="Search recipes by name..." autocomplete="off">
        <button id="craft-clear" class="clear-btn" style="display:none;">✕</button>
      </div>
    </section>

    <div class="stats-bar">
      <span id="recipe-count">1 recipe</span>
      <span class="stats-divider">•</span>
      <span>Click any card to view full recipe</span>
    </div>

    <section class="grid recipe-grid" id="craft-list">
      <!-- Example link pattern - copy this for each recipe -->
      <a href="recipes/recipe-name.html" class="card recipe-card" data-item="Wooden Sword">
        <div class="recipe-name">Wooden Sword</div>
      </a>
      
      <!-- Add more recipes here using the same pattern -->
    </section>

    <div id="craft-no-results" class="no-results" style="display:none;">
      <p>No recipes found matching your search.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>&copy; 2026 Cubic Crypto | Not affiliated with Cubic Castles.</span>
    </div>
  </footer>
</body>
</html>

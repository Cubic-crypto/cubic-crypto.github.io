<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Wooden Sword Recipe — Cubic Crypto</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="../styles.css"/>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="brand"><img src="../Cubic_Crypto.png" alt="Cubic Crypto"></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <nav class="nav">
      <a href="../index.html">Home</a>
      <a href="../prices.html">Prices</a>
      <a href="../craft.html" class="active">Crafting</a>
      <a href="../contact-support.html">Support</a>
    </nav>
  </header>

  <main class="container">
    <!-- Back Button -->
    <a href="../craft.html" class="btn-secondary" style="margin-bottom: 16px; display: inline-block;">← Back to Recipes</a>

    <!-- Recipe Header -->
    <section class="card">
      <h1>Wooden Sword</h1>
      <p class="header-subtitle">Basic melee weapon for beginners</p>
    </section>

    <!-- Recipe Content -->
    <div class="recipe-detail-layout">
      <!-- Materials Section -->
      <section class="card">
        <h2>Materials Required</h2>
        <div class="materials-grid">
          <div class="material-item">
            <img src="../assets/items/wood-planks.png" alt="Wood Planks" class="material-image">
            <div class="material-info">
              <div class="material-name">Wood Planks</div>
              <div class="material-quantity">x2</div>
            </div>
          </div>
          <div class="material-item">
            <img src="../assets/items/stick.png" alt="Stick" class="material-image">
            <div class="material-info">
              <div class="material-name">Stick</div>
              <div class="material-quantity">x1</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Tools Section -->
      <section class="card">
        <h2>Tools Required</h2>
        <div class="materials-grid">
          <div class="material-item">
            <img src="../assets/tools/crafting-table.png" alt="Crafting Table" class="material-image">
            <div class="material-info">
              <div class="material-name">Crafting Table</div>
              <div class="material-quantity">Required</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Crafting Instructions -->
      <section class="card">
        <h2>Crafting Pattern</h2>
        <div class="crafting-grid-container">
          <div class="crafting-grid">
            <div class="craft-slot"><img src="../assets/items/wood-planks.png" alt="Wood"></div>
            <div class="craft-slot empty"></div>
            <div class="craft-slot empty"></div>
            <div class="craft-slot"><img src="../assets/items/wood-planks.png" alt="Wood"></div>
            <div class="craft-slot empty"></div>
            <div class="craft-slot empty"></div>
            <div class="craft-slot"><img src="../assets/items/stick.png" alt="Stick"></div>
            <div class="craft-slot empty"></div>
            <div class="craft-slot empty"></div>
          </div>
          <div class="crafting-arrow">→</div>
          <div class="crafting-result">
            <img src="../assets/items/wooden-sword.png" alt="Wooden Sword" class="result-image">
            <div class="result-name">Wooden Sword</div>
          </div>
        </div>
      </section>

      <!-- Result -->
      <section class="card">
        <h2>Result</h2>
        <div class="result-display">
          <img src="../assets/items/wooden-sword.png" alt="Wooden Sword" class="result-image-large">
          <div class="result-details">
            <div class="result-name-large">Wooden Sword</div>
            <div class="result-description">A basic wooden sword. Deals 4 damage.</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>&copy; 2025 Cubic Crypto</span>
    </div>
  </footer>
</body>
</html>
